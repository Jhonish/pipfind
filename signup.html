<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up — PipeFind</title>
  <meta
    name="description"
    content="Create your PipeFind account."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* Navigation */

    nav {
      border-bottom: 1px solid #222;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .back {
      color: #888;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    /* Main */

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 80px 20px;
    }

    .signup-container {
      width: 100%;
      max-width: 480px;
    }

    .heading {
      margin-bottom: 40px;
    }

    .heading h1 {
      font-size: 42px;
      letter-spacing: -1.5px;
    }

    .heading p {
      margin-top: 10px;
      color: #777;
      font-size: 15px;
    }

    /* Account type */

    .account-label {
      display: block;
      margin-bottom: 12px;
      color: #aaa;
      font-size: 13px;
    }

    .account-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }

    .account-option {
      position: relative;
    }

    .account-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .account-option label {
      display: block;
      padding: 18px;
      border: 1px solid #333;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .account-option label:hover {
      border-color: #777;
    }

    .account-option input:checked + label {
      border-color: #fff;
    }

    .account-option-title {
      font-weight: 600;
    }

    .account-option-description {
      display: block;
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    /* Form */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 13px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 15px;
      background: #050505;
      color: #fff;
      border: 1px solid #333;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    .submit-button {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: 1px solid #fff;
      background: #fff;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #ddd;
    }

    .login-link {
      margin-top: 25px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .login-link a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .login-link a:hover {
      color: #aaa;
    }

    .terms {
      margin-top: 25px;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    /* Footer */

    footer {
      border-top: 1px solid #222;
      padding: 25px 20px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }

    /* Mobile */

    @media (max-width: 500px) {
      main {
        padding: 60px 20px;
      }

      .heading h1 {
        font-size: 36px;
      }

      .account-types {
        grid-template-columns: 1fr;
      }

      .nav-inner {
        padding: 18px 20px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">PipeFind</a>

      <a href="index.html" class="back">← Back</a>
    </div>
  </nav>


  <main>

    <div class="signup-container">

      <div class="heading">
        <h1>Create your account.</h1>
        <p>Choose how you'll use PipeFind.</p>
      </div>


      <!-- Account Type -->

      <span class="account-label">I am...</span>

      <div class="account-types">

        <div class="account-option">
          <input
            type="radio"
            id="customer"
            name="accountType"
            value="customer"
            checked
          >

          <label for="customer">
            <span class="account-option-title">
              A customer
            </span>

            <span class="account-option-description">
              I need a plumber.
            </span>
          </label>
        </div>


        <div class="account-option">
          <input
            type="radio"
            id="plumber"
            name="accountType"
            value="plumber"
          >

          <label for="plumber">
            <span class="account-option-title">
              A plumber
            </span>

            <span class="account-option-description">
              I want to find jobs.
            </span>
          </label>
        </div>

      </div>


      <!-- Signup Form -->

      <form id="signupForm">

        <div class="form-group">
          <label for="name">Full name</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            required
          >
        </div>


        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          >
        </div>


        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            minlength="8"
            required
          >
        </div>


        <button type="submit" class="submit-button">
          Create account
        </button>

      </form>


      <div class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

      <p class="terms">
        By creating an account, you agree to PipeFind's
        terms and privacy policy.
      </p>

    </div>

  </main>


  <footer>
    © 2026 PipeFind
  </footer>


  <script>
    const form = document.getElementById("signupForm");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      const accountType =
        document.querySelector(
          'input[name="accountType"]:checked'
        ).value;

      /*
        Supabase authentication will be connected here.

        accountType will be either:
        "customer"
        or
        "plumber"
      */

      alert(
        "Signup is ready to connect to Supabase.\n\n" +
        "Account type: " + accountType
      );
    });
  </script>

</body>
</html>
