<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — PipeFind</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    input,
    button {
      font: inherit;
    }

    /* NAV */

    nav {
      border-bottom: 1px solid #222;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .back {
      color: #777;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    /* MAIN */

    main {
      flex: 1;

      display: flex;
      justify-content: center;

      padding: 100px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .heading h1 {
      font-size: 44px;
      line-height: 1;
      letter-spacing: -2px;
    }

    .heading p {
      margin-top: 12px;
      color: #777;
      font-size: 15px;
    }

    /* FORM */

    form {
      margin-top: 42px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;

      color: #aaa;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 15px;

      background: #050505;
      color: #fff;

      border: 1px solid #333;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .password-row label {
      margin-bottom: 0;
    }

    .forgot {
      color: #666;
      font-size: 12px;
    }

    .forgot:hover {
      color: #fff;
    }

    .submit {
      width: 100%;

      margin-top: 8px;
      padding: 15px;

      background: #fff;
      color: #000;

      border: 1px solid #fff;

      font-weight: 600;
      cursor: pointer;
    }

    .submit:hover {
      background: #ddd;
    }

    /* SIGNUP */

    .signup {
      margin-top: 28px;

      text-align: center;

      color: #666;
      font-size: 14px;
    }

    .signup a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .signup a:hover {
      color: #aaa;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;

      margin: 35px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #222;
    }

    .divider span {
      color: #555;
      font-size: 12px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #222;

      padding: 25px 20px;

      text-align: center;

      color: #555;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .nav-inner {
        padding: 18px 20px;
      }

      main {
        padding: 70px 20px;
      }

      .heading h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->

  <nav>

    <div class="nav-inner">

      <a href="index.html" class="logo">
        PipeFind
      </a>

      <a href="index.html" class="back">
        ← Back
      </a>

    </div>

  </nav>


  <!-- MAIN -->

  <main>

    <div class="container">

      <div class="heading">

        <h1>
          Welcome back.
        </h1>

        <p>
          Sign in to your PipeFind account.
        </p>

      </div>


      <!-- LOGIN FORM -->

      <form action="dashboard.html" method="get">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <div class="password-row">

            <label for="password">
              Password
            </label>

            <a href="#" class="forgot">
              Forgot password?
            </a>

          </div>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="submit"
        >
          Sign in
        </button>

      </form>


      <div class="divider">
        <span>OR</span>
      </div>


      <div class="signup">

        Don't have an account?

        <a href="signup.html">
          Create one
        </a>

      </div>

    </div>

  </main>


  <footer>
    © 2026 PipeFind
  </footer>

</body>
</html>
